syntax = "proto3";

package task;

option go_package = "github.com/rovioletta/todo-list/pkg/pb/task;task";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (google.protobuf.Empty);
  rpc GetTaskByID(GetTaskByIDRequest) returns (GetTaskByIDResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
  rpc GetTasksByFilter(GetTasksByFilterRequest) returns (GetTasksByFilterResponse);
}

message CreateTaskRequest {
  string title = 1 [(buf.validate.field).string = {
    min_len: 5,
    max_len: 32
  }];
  string description = 2 [(buf.validate.field).string = {
    min_len: 1,
  }];
}

message CreateTaskResponse {
  uint64 task_id = 1;
}

enum TaskStatus {
  TASK_STATUS_UNKNOWN = 0;
  TASK_STATUS_BACKLOG = 1;
  TASK_STATUS_TODO = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_IN_REVIEW = 4;
  TASK_STATUS_DONE = 5;
  TASK_STATUS_CANCELED = 6;
}

message UpdateTaskRequest {
  uint64 task_id = 1;
  optional string title = 2 [(buf.validate.field).string = {
    min_len: 5,
    max_len: 32
  }];
  optional string description = 3 [(buf.validate.field).string = {
    min_len: 1,
  }];

  optional TaskStatus status = 4;
}

message GetTaskByIDRequest {
  uint64 task_id = 1;
}

message Task {
  uint64 id = 1;
  string title = 2;
  string description = 3;
  TaskStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetTaskByIDResponse {
  Task task = 1;
}

message DeleteTaskRequest {
  uint64 task_id = 1;
}

message Filter {
  optional string search_title = 1;
  optional TaskStatus search_status = 2;
  optional google.protobuf.Timestamp created_from = 3;
  optional google.protobuf.Timestamp created_to = 4;
}

message Sort {
  optional string field = 1 [(buf.validate.field).string = {
    in: ["title", "status", "created_at"]
  }]; ;
  optional string order = 2 [(buf.validate.field).string = {
    in: ["asc", "desc"]
  }]; ;
}

message Pagination {
  uint64 limit = 1;
  uint64 offset = 2;
}

message GetTasksByFilterRequest {
  optional Filter filter = 1;
  optional Sort sort = 2;
  optional Pagination pagination = 3;
}

message GetTasksByFilterResponse {
  repeated Task tasks = 1;
}